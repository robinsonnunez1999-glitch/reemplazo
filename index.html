<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Portería · Control de Acceso</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --verde: #2F4A3C;
    --verde-osc: #223629;
    --fondo: #F2EFE4;
    --panel: #FFFFFF;
    --linea: #DAD4C0;
    --barro: #A13D2E;
    --barro-osc: #832F22;
    --exito: #4C7A5C;
    --ambar: #B57A1E;
    --texto: #22261F;
    --texto-suave: #6B6858;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--fondo);color:var(--texto);font-family:var(--sans);height:100%;}
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--fondo);}

  header.top{background:var(--verde);color:#fff;padding:18px 20px 14px;}
  header.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px;}
  header.top p{margin:3px 0 0;font-size:13px;color:#CFE0D2;}

  nav.tabs{display:flex;background:var(--verde-osc);}
  nav.tabs button{flex:1;padding:12px 6px;background:none;border:none;color:#B9C7BB;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--barro);background:rgba(255,255,255,.04);}

  main{flex:1;padding:16px;padding-bottom:60px;}

  .card{background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:16px;margin-bottom:14px;}

  .search-box{position:sticky;top:0;z-index:5;}
  input[type=text], input[type=date], select{
    width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--linea);border-radius:6px;
    background:#fff;color:var(--texto);font-family:var(--sans);
  }
  input[type=text]:focus, input[type=date]:focus, select:focus{outline:2px solid var(--verde);outline-offset:1px;border-color:var(--verde);}

  .counter-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
  .counter{flex:1 1 calc(50% - 5px);min-width:120px;background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:10px 12px;text-align:center;}
  .counter .num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--verde);}
  .counter .lbl{font-size:11.5px;color:var(--texto-suave);margin-top:2px;}

  ul.results{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  li.person{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:13px 14px;
    cursor:pointer;
  }
  li.person:active{background:#EEEAD9;}
  .p-info .p-name{font-weight:700;font-size:15px;}
  .p-info .p-area{font-size:12.5px;color:var(--texto-suave);margin-top:2px;}
  .badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;font-family:var(--mono);}
  .badge.fuera{background:#EDE9DC;color:var(--texto-suave);}
  .badge.dentro{background:#E4EEE6;color:var(--exito);}

  .empty{color:var(--texto-suave);text-align:center;padding:30px 10px;font-size:14px;}

  button.action{
    background:var(--verde);color:#fff;border:none;border-radius:6px;padding:12px 16px;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  button.action.secundario{background:transparent;color:var(--verde);border:1.5px solid var(--verde);}
  button.action.peligro{background:var(--barro);}
  button.action:active{opacity:.85;}
  button.link-btn{background:none;border:none;color:var(--barro);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;}

  h2.section-title{font-size:14px;text-transform:none;color:var(--verde-osc);margin:4px 0 10px;font-weight:700;}

  table.reporte{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.reporte th{text-align:left;font-size:11.5px;color:var(--texto-suave);border-bottom:1.5px solid var(--linea);padding:6px 4px;font-weight:700;}
  table.reporte td{padding:8px 4px;border-bottom:1px solid var(--linea);}
  table.reporte td.time{font-family:var(--mono);}
  table.reporte tr.extra td{color:var(--texto-suave);font-style:italic;}
  table.reporte tr.total-row td{font-weight:700;background:#F4F1E4;}
  .area-group{margin-bottom:18px;}
  .area-group h3{font-size:14px;margin:0 0 6px;color:var(--barro-osc);display:flex;justify-content:space-between;}
  .area-group h3 span.n{font-family:var(--mono);color:var(--texto-suave);font-size:12.5px;}

  .row{display:flex;gap:10px;align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .grow{flex:1;}

  .staff-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--linea);}
  .staff-row:last-child{border-bottom:none;}
  .staff-row .meta{font-size:12.5px;color:var(--texto-suave);}
  .staff-row .del{color:var(--barro);background:none;border:none;font-size:13px;cursor:pointer;font-weight:700;}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--verde-osc);color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;max-width:88%;text-align:center;
  }

  textarea.export{width:100%;min-height:140px;font-family:var(--mono);font-size:12px;border:1.5px solid var(--linea);border-radius:6px;padding:10px;}

  label.field-label{font-size:12.5px;color:var(--texto-suave);font-weight:700;display:block;margin:0 0 5px;}

  #lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--verde-osc);}
  .lock-card{background:var(--panel);border-radius:8px;padding:28px 24px;max-width:340px;width:100%;text-align:center;}
  .lock-card h1{font-size:18px;margin:0 0 4px;color:var(--verde-osc);}
  .lock-card p{font-size:13px;color:var(--texto-suave);margin:0 0 18px;}
  .lock-card input[type=password]{text-align:center;font-size:22px;letter-spacing:4px;font-family:var(--mono);margin-bottom:12px;}
  .lock-card .err{color:var(--barro);font-size:13px;min-height:18px;margin-bottom:8px;}

  .role-badge{font-size:11.5px;color:#CFE0D2;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:12px;display:inline-block;margin-top:6px;}
  .logout-link{background:none;border:none;color:#CFE0D2;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-left:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  // ⚠️ Pega aquí el firebaseConfig de tu proyecto (Firebase console → Configuración del proyecto → Tus apps)
  const firebaseConfig = {
    apiKey: "AIzaSyAzoh4UHDyXVt7lpK82NhSanBs6u89j2U8",
    authDomain: "galpon-reemplazos.firebaseapp.com",
    projectId: "galpon-reemplazos",
    storageBucket: "galpon-reemplazos.firebasestorage.app",
    messagingSenderId: "33289343335",
    appId: "1:33289343335:web:5efd5550b7745be1645fc2"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const COL = {
    meta: 'porteria_meta',       // docs: staff, areas, auth
    records: 'porteria_records', // doc id = fecha (personal fijo)
    visitors: 'porteria_visitantes' // doc id = fecha (visitantes)
  };

  const STORAGE_KEYS = {
    recordsPrefix: 'records:',
    visitorsPrefix: 'visitors:'
  };

  const MOTIVOS_VISITA = [
    'Proveedor',
    'Carga de animales',
    'Entrega de alimento para animales',
    'Visita técnica',
    'Otro'
  ];

  const DEFAULT_AREAS = [
    'Sitio 1 - Gestación y Montas',
    'Sitio 1 - Maternidad',
    'Sitio 2',
    'Sitio 3',
    'Lavado',
    'Comedor',
    'Administración',
    'Mantenimiento',
    'Seguridad'
  ];

  const DEFAULT_STAFF = [
    {id:'s1', name:'Nelly Pallasco', area:'Sitio 1 - Gestación y Montas'},
    {id:'s2', name:'Karen Chichanda', area:'Sitio 1 - Gestación y Montas'},
    {id:'s3', name:'Jordan Caicedo', area:'Sitio 1 - Gestación y Montas'},
    {id:'s4', name:'Javier Gutiérrez', area:'Sitio 1 - Gestación y Montas'},
    {id:'s5', name:'Nicolás Holguín', area:'Sitio 1 - Maternidad'},
    {id:'s6', name:'José Zambrano', area:'Sitio 1 - Maternidad'},
    {id:'s7', name:'Erika Cagua', area:'Sitio 1 - Maternidad'},
    {id:'s8', name:'Edith Mendoza', area:'Sitio 1 - Maternidad'},
    {id:'s9', name:'Sebastián Pereira', area:'Sitio 2'},
    {id:'s10', name:'Luis Arroyo', area:'Sitio 2'},
    {id:'s11', name:'César Pinchao', area:'Sitio 3'},
    {id:'s12', name:'Daniel Taquez', area:'Sitio 3'},
    {id:'s13', name:'Daniel Macías', area:'Lavado'},
    {id:'s14', name:'Carlos Lucas', area:'Seguridad'},
    {id:'s15', name:'Andrés Castillo', area:'Administración', resident:true},
    {id:'s16', name:'Mayra Barragán', area:'Administración', resident:true},
    {id:'s17', name:'Richard López', area:'Administración', resident:true},
    {id:'s18', name:'Robinson Núñez', area:'Administración', resident:true}
  ];

  let state = {
    tab: 'porteria',
    porteriaMode: 'entrada',
    staff: [],
    areas: [],
    search: '',
    recordsByDate: {},
    visitorsByDate: {},
    reportDate: todayStr(),
    comedorDate: todayStr(),
    session: null,       // {role: 'guardia'|'admin'}
    pins: {guardiaHash:null, adminHash:null},
    loginError: '',
    residentesAbiertos: {},  // {staffId: 'YYYY-MM-DD' del día en que se abrió su ingreso}
    guardias: [],            // [{id, nombre, pin, pinHash}]
    administrativos: [],     // [{id, nombre, pin, pinHash}]
    autorizadosTelefono: [], // [{id, nombre, autorizadoPor}]
    telefonoPrompt: null,    // {person} mientras se pregunta si deja o ingresa el teléfono
    telefonoDate: todayStr()
  };

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function nowTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function normalize(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  function uid(){
    return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  }

  async function sha256Hex(str){
    const enc = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  const recordListeners = {};
  const visitorListeners = {};

  function bootstrapAndListen(){
    // Personal
    db.collection(COL.meta).doc('staff').onSnapshot(snap=>{
      if(snap.exists && snap.data().list){ state.staff = snap.data().list; }
      else { db.collection(COL.meta).doc('staff').set({list: DEFAULT_STAFF}); state.staff = DEFAULT_STAFF; }
      render();
    }, ()=> showToast('No se pudo conectar con la nube. Revisa tu internet.'));

    // Áreas
    db.collection(COL.meta).doc('areas').onSnapshot(snap=>{
      if(snap.exists && snap.data().list){ state.areas = snap.data().list; }
      else { db.collection(COL.meta).doc('areas').set({list: DEFAULT_AREAS}); state.areas = DEFAULT_AREAS; }
      render();
    });

    // PINes (guardados como hash, nunca en texto plano)
    db.collection(COL.meta).doc('auth').onSnapshot(async snap=>{
      if(snap.exists && snap.data().guardiaHash && snap.data().adminHash){
        state.pins = {guardiaHash: snap.data().guardiaHash, adminHash: snap.data().adminHash};
      } else {
        const [gh, ah] = await Promise.all([sha256Hex('1234'), sha256Hex('9090')]);
        await db.collection(COL.meta).doc('auth').set({guardiaHash: gh, adminHash: ah});
      }
    });

    // Residentes con ingreso abierto (se arrastra entre días hasta que registren salida)
    db.collection(COL.meta).doc('residentes').onSnapshot(snap=>{
      state.residentesAbiertos = (snap.exists && snap.data().open) || {};
      render();
    });

    // Guardias con PIN individual (para saber quién registró cada movimiento)
    db.collection(COL.meta).doc('guardias').onSnapshot(snap=>{
      state.guardias = (snap.exists && snap.data().list) || [];
      render();
    });

    // Administrativos (ven Visitantes, Reporte, Historial, Comedor y Personal)
    db.collection(COL.meta).doc('administrativos').onSnapshot(snap=>{
      state.administrativos = (snap.exists && snap.data().list) || [];
      render();
    });

    // Lista de personas autorizadas para ingresar teléfono
    db.collection(COL.meta).doc('telefono_autorizados').onSnapshot(snap=>{
      state.autorizadosTelefono = (snap.exists && snap.data().list) || [];
      render();
    });

    subscribeRecords(todayStr());
    subscribeVisitors(todayStr());
    render();
  }

  function subscribeRecords(date){
    if(recordListeners[date]) return;
    recordListeners[date] = db.collection(COL.records).doc(date).onSnapshot(snap=>{
      state.recordsByDate[date] = (snap.exists && snap.data().list) || [];
      render();
    });
  }

  function subscribeVisitors(date){
    if(visitorListeners[date]) return;
    visitorListeners[date] = db.collection(COL.visitors).doc(date).onSnapshot(snap=>{
      state.visitorsByDate[date] = (snap.exists && snap.data().list) || [];
      render();
    });
  }

  async function saveRecords(date){
    try{
      await db.collection(COL.records).doc(date).set({list: state.recordsByDate[date] || []});
    }catch(e){
      showToast('No se pudo guardar. Revisa tu internet.');
    }
  }

  async function saveVisitors(date){
    try{
      await db.collection(COL.visitors).doc(date).set({list: state.visitorsByDate[date] || []});
    }catch(e){
      showToast('No se pudo guardar. Revisa tu internet.');
    }
  }

  async function saveStaff(){
    try{ await db.collection(COL.meta).doc('staff').set({list: state.staff}); }
    catch(e){ showToast('No se pudo guardar el personal.'); }
  }

  async function saveAreas(){
    try{ await db.collection(COL.meta).doc('areas').set({list: state.areas}); }
    catch(e){ showToast('No se pudo guardar las áreas.'); }
  }

  async function savePins(pinGuardia, pinAdmin){
    try{
      const [gh, ah] = await Promise.all([sha256Hex(pinGuardia), sha256Hex(pinAdmin)]);
      await db.collection(COL.meta).doc('auth').set({guardiaHash: gh, adminHash: ah});
      showToast('PINes actualizados.');
    }catch(e){ showToast('No se pudo guardar los PINes.'); }
  }

  async function addVisitor(data){
    const date = todayStr();
    if(!state.visitorsByDate[date]) state.visitorsByDate[date] = [];
    state.visitorsByDate[date].push({
      id: uid(), name: data.name, motivo: data.motivo, area: data.area,
      cedula: data.cedula || '', placa: data.placa || '', entrada: nowTime(), entradaPor: actorName(), salida: null, salidaPor: null
    });
    await saveVisitors(date);
    showToast(data.name+' registró entrada · '+nowTime());
    render();
  }

  async function closeVisitor(visitorId){
    const date = todayStr();
    const list = state.visitorsByDate[date] || [];
    const v = list.find(x=>x.id===visitorId && !x.salida);
    if(v){
      v.salida = nowTime();
      v.salidaPor = actorName();
      await saveVisitors(date);
      showToast(v.name+' registró salida · '+v.salida);
      render();
    }
  }

  function getOpenSession(personId, date){
    const list = state.recordsByDate[date] || [];
    for(let i=list.length-1;i>=0;i--){
      if(list[i].staffId===personId && !list[i].salida) return list[i];
    }
    return null;
  }

  function getSessions(personId, date){
    return (state.recordsByDate[date] || []).filter(r=>r.staffId===personId);
  }

  function isInside(personId, date){
    const person = state.staff.find(p=>p.id===personId);
    if(person && person.resident){
      return !!state.residentesAbiertos[personId];
    }
    return !!getOpenSession(personId, date);
  }

  async function toggleEntry(person){
    const date = todayStr();
    if(isInside(person.id, date)) await registrarSalidaStaff(person);
    else await registrarEntradaStaff(person);
  }

  async function saveResidentesAbiertos(){
    try{ await db.collection(COL.meta).doc('residentes').set({open: state.residentesAbiertos}); }
    catch(e){ showToast('No se pudo guardar el estado de residentes.'); }
  }

  async function registrarEntradaStaff(person, telefonoInfo){
    const date = todayStr();
    if(!state.recordsByDate[date]) state.recordsByDate[date] = [];
    if(isInside(person.id, date)){
      showToast(person.name + ' ya está dentro.');
      return;
    }
    const sesion = {
      staffId: person.id, name: person.name, area: person.area,
      entrada: nowTime(), entradaPor: actorName(), salida: null, salidaPor: null
    };
    if(telefonoInfo && telefonoInfo.estado==='dejado'){
      sesion.telefono = 'dejado';
    } else if(telefonoInfo && telefonoInfo.estado==='ingresado'){
      sesion.telefono = 'ingresado';
      sesion.telefonoAutorizadoPor = telefonoInfo.autorizadoPor || 'Sin autorización registrada';
    } else if(telefonoInfo && telefonoInfo.estado==='sin_celular'){
      sesion.telefono = 'sin_celular';
    }
    state.recordsByDate[date].push(sesion);
    await saveRecords(date);
    if(person.resident){
      state.residentesAbiertos[person.id] = date;
      await saveResidentesAbiertos();
    }
    const n = getSessions(person.id, date).length;
    showToast(person.name + (n>1 ? ' registró un nuevo ingreso · ' : ' registró entrada · ') + nowTime());
    render();
  }

  async function registrarSalidaStaff(person){
    const today = todayStr();

    if(person.resident){
      const origen = state.residentesAbiertos[person.id];
      if(!origen){
        showToast(person.name + ' no tiene una entrada abierta.');
        return;
      }
      let arr;
      if(state.recordsByDate[origen]){
        arr = state.recordsByDate[origen];
      } else {
        try{
          const snap = await db.collection(COL.records).doc(origen).get();
          arr = (snap.exists && snap.data().list) || [];
        }catch(e){ showToast('No se pudo leer la entrada original.'); return; }
      }
      let sess = null;
      for(let i=arr.length-1;i>=0;i--){ if(arr[i].staffId===person.id && !arr[i].salida){ sess = arr[i]; break; } }
      if(!sess){
        // Estado inconsistente: limpiar y avisar
        delete state.residentesAbiertos[person.id];
        await saveResidentesAbiertos();
        showToast(person.name + ' no tenía una entrada abierta. Se limpió su estado.');
        render();
        return;
      }
      sess.salida = nowTime();
      sess.salidaPor = actorName();
      if(origen !== today) sess.salidaFecha = today;
      state.recordsByDate[origen] = arr;
      try{ await db.collection(COL.records).doc(origen).set({list: arr}); }
      catch(e){ showToast('No se pudo guardar. Revisa tu internet.'); return; }
      delete state.residentesAbiertos[person.id];
      await saveResidentesAbiertos();
      showToast(person.name + ' registró salida · ' + sess.salida);
      render();
      return;
    }

    const open = getOpenSession(person.id, today);
    if(!open){
      showToast(person.name + ' no tiene una entrada abierta.');
      return;
    }
    open.salida = nowTime();
    open.salidaPor = actorName();
    await saveRecords(today);
    showToast(person.name + ' registró salida · ' + open.salida);
    render();
  }

  async function saveGuardias(){
    try{ await db.collection(COL.meta).doc('guardias').set({list: state.guardias}); }
    catch(e){ showToast('No se pudo guardar los guardias.'); }
  }

  async function saveAdministrativos(){
    try{ await db.collection(COL.meta).doc('administrativos').set({list: state.administrativos}); }
    catch(e){ showToast('No se pudo guardar los administrativos.'); }
  }

  async function saveAutorizadosTelefono(){
    try{ await db.collection(COL.meta).doc('telefono_autorizados').set({list: state.autorizadosTelefono}); }
    catch(e){ showToast('No se pudo guardar la lista de autorizados.'); }
  }

  function actorName(){
    if(!state.session) return 'Desconocido';
    if(state.session.role==='admin') return 'Administración';
    if(state.session.role==='administrativo') return state.session.nombre || 'Administrativo';
    return state.session.guardName || 'Guardia';
  }

  let toastTimer = null;
  function showToast(msg){
    let t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2200);
  }

  function generarPdf(filename, title, sub, sections){
    if(!window.jspdf || !window.jspdf.jsPDF){
      showToast('El generador de PDF no cargó. Revisa tu conexión e intenta de nuevo.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14);
    doc.text(title, 14, 16);
    doc.setFontSize(10);
    doc.setTextColor(90);
    doc.text(sub, 14, 22);
    doc.setTextColor(0);
    let y = 28;
    sections.forEach(sec=>{
      if(sec.rows.length===0) return;
      if(sec.heading){
        doc.setFontSize(11);
        doc.text(sec.heading, 14, y);
        y += 4;
      }
      doc.autoTable({
        startY: y,
        head: [sec.headers],
        body: sec.rows,
        styles: {fontSize:9, cellPadding:3},
        headStyles: {fillColor: [47,74,60]},
        margin: {left:14, right:14}
      });
      y = doc.lastAutoTable.finalY + 10;
    });
    doc.save(filename);
    showToast('PDF generado.');
  }

  function csvEscape(v){
    v = String(v==null?'':v);
    if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
    return v;
  }

  function downloadFile(filename, content, mime){
    const blob = new Blob([content], {type: mime || 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  }

  async function resolverTelefonoYEntrar(opcion){
    const prompt = state.telefonoPrompt;
    if(!prompt) return;
    const person = prompt.person;
    state.telefonoPrompt = null;

    if(opcion==='sin_celular'){
      await registrarEntradaStaff(person, {estado:'sin_celular'});
      return;
    }
    if(opcion==='deja'){
      await registrarEntradaStaff(person, {estado:'dejado'});
      return;
    }

    const norm = normalize(person.name);
    const autorizado = state.autorizadosTelefono.find(a=>normalize(a.nombre)===norm);
    if(autorizado){
      await registrarEntradaStaff(person, {estado:'ingresado', autorizadoPor: autorizado.autorizadoPor});
    } else {
      const quien = window.prompt(person.name+' no está en la lista de autorizados para ingresar teléfono.\n¿Quién autoriza el ingreso?');
      await registrarEntradaStaff(person, {estado:'ingresado', autorizadoPor: (quien && quien.trim()) || 'Sin autorización registrada'});
    }
  }

  function renderHistorial(){
    const wrap = document.createElement('div');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h2 class="section-title">Bitácora de días registrados</h2><div id="historial-body"><div class="empty">Cargando historial…</div></div>';
    wrap.appendChild(card);

    setTimeout(loadHistorial, 0);

    async function loadHistorial(){
      const body = document.getElementById('historial-body');
      if(!body) return;
      let recordDocs = [], visitorDocs = [];
      try{
        const rs = await db.collection(COL.records).orderBy(firebase.firestore.FieldPath.documentId(),'desc').limit(60).get();
        recordDocs = rs.docs;
      }catch(e){}
      try{
        const vs = await db.collection(COL.visitors).orderBy(firebase.firestore.FieldPath.documentId(),'desc').limit(60).get();
        visitorDocs = vs.docs;
      }catch(e){}

      const counts = {};
      recordDocs.forEach(d=>{
        const arr = (d.data() && d.data().list) || [];
        counts[d.id] = counts[d.id] || {personal:0, visitantes:0};
        counts[d.id].personal = new Set(arr.map(x=>x.staffId)).size;
      });
      visitorDocs.forEach(d=>{
        const arr = (d.data() && d.data().list) || [];
        counts[d.id] = counts[d.id] || {personal:0, visitantes:0};
        counts[d.id].visitantes = arr.length;
      });

      const sorted = Object.keys(counts).sort().reverse();

      if(sorted.length===0){
        body.innerHTML = '<div class="empty">Todavía no hay días registrados.</div>';
        return;
      }

      body.innerHTML = '';
      sorted.forEach(date=>{
        const personalCount = counts[date].personal;
        const visitorCount = counts[date].visitantes;
        const row = document.createElement('div');
        row.className = 'staff-row';
        const info = document.createElement('div');
        info.innerHTML = '<div style="font-weight:700;">'+formatDateEs(date)+'</div>'+
          '<div class="meta">'+personalCount+' del personal · '+visitorCount+' visitantes</div>';
        const btn = document.createElement('button');
        btn.className = 'link-btn';
        btn.textContent = 'Ver detalle';
        btn.onclick = ()=>{
          state.reportDate = date;
          subscribeRecords(date);
          subscribeVisitors(date);
          state.tab = 'reporte';
          render();
        };
        row.appendChild(info);
        row.appendChild(btn);
        body.appendChild(row);
      });
    }

    return wrap;
  }

  function formatDateEs(dateStr){
    const parts = dateStr.split('-');
    if(parts.length!==3) return dateStr;
    const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('es-EC', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }

  function buildCuentaCard(opts){
    // opts: {title, desc, list, saveFn, roleName}
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h2 class="section-title">'+opts.title+'</h2><p style="margin:0 0 10px;font-size:12.5px;color:var(--texto-suave);">'+opts.desc+'</p>';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'Nombre';
    nameInput.style.marginBottom = '10px';
    const pinInput = document.createElement('input');
    pinInput.type = 'text';
    pinInput.inputMode = 'numeric';
    pinInput.placeholder = 'PIN';
    pinInput.style.marginBottom = '10px';
    const btnAdd = document.createElement('button');
    btnAdd.className = 'action secundario';
    btnAdd.textContent = 'Agregar';

    function pinEnUso(hash, excludeId){
      const enGuardias = state.guardias.some(g=>g.id!==excludeId && g.pinHash===hash);
      const enAdmins = state.administrativos.some(a=>a.id!==excludeId && a.pinHash===hash);
      return enGuardias || enAdmins || hash===state.pins.adminHash || hash===state.pins.guardiaHash;
    }

    btnAdd.onclick = async ()=>{
      const nombre = nameInput.value.trim();
      const pin = pinInput.value.trim();
      if(!nombre || !pin){ showToast('Completa nombre y PIN.'); return; }
      let hash;
      try{ hash = await sha256Hex(pin); }
      catch(e){ showToast('No se pudo procesar el PIN. Usa el link https:// publicado.'); return; }
      if(pinEnUso(hash, null)){ showToast('Ese PIN ya está en uso, elige otro.'); return; }
      opts.list.push({id: uid(), nombre, pin, pinHash: hash});
      await opts.saveFn();
      nameInput.value=''; pinInput.value='';
      render();
      showToast(nombre+' agregado.');
    };
    card.appendChild(nameInput);
    card.appendChild(pinInput);
    card.appendChild(btnAdd);

    if(opts.list.length>0){
      const list = document.createElement('div');
      list.style.marginTop = '14px';
      opts.list.forEach(u=>{
        const row = document.createElement('div');
        row.className = 'staff-row';
        row.innerHTML = '<div><div class="u-name" style="font-weight:600;"></div><div class="meta">PIN: <span class="u-pin" style="font-family:var(--mono);"></span></div></div>';
        row.querySelector('.u-name').textContent = u.nombre;
        row.querySelector('.u-pin').textContent = u.pin || '(oculto)';
        const btnGroup = document.createElement('div');
        btnGroup.style.cssText = 'display:flex;gap:14px;';
        const change = document.createElement('button');
        change.className = 'del';
        change.style.color = 'var(--verde)';
        change.textContent = 'Cambiar PIN';
        change.onclick = async ()=>{
          const nuevo = window.prompt('Nuevo PIN para '+u.nombre+':');
          if(!nuevo) return;
          const val = nuevo.trim();
          if(!val){ showToast('PIN vacío, no se cambió nada.'); return; }
          let hash;
          try{ hash = await sha256Hex(val); }
          catch(e){ showToast('No se pudo procesar el PIN. Usa el link https:// publicado.'); return; }
          if(pinEnUso(hash, u.id)){ showToast('Ese PIN ya está en uso, elige otro.'); return; }
          u.pin = val; u.pinHash = hash;
          await opts.saveFn();
          render();
          showToast('PIN de '+u.nombre+' actualizado.');
        };
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'Eliminar';
        del.onclick = async ()=>{
          const idx = opts.list.indexOf(u);
          if(idx>-1) opts.list.splice(idx,1);
          await opts.saveFn();
          render();
        };
        btnGroup.appendChild(change);
        btnGroup.appendChild(del);
        row.appendChild(btnGroup);
        list.appendChild(row);
      });
      card.appendChild(list);
    }
    return card;
  }

    const addCard = document.createElement('div');
    addCard.className = 'card';
    addCard.innerHTML = '<h2 class="section-title">Agregar persona</h2>';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'Nombre completo';
    nameInput.style.marginBottom = '10px';
    const areaSelect = document.createElement('select');
    state.areas.forEach(a=>{
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      areaSelect.appendChild(opt);
    });
    const btnAdd = document.createElement('button');
    btnAdd.className = 'action';
    btnAdd.textContent = 'Agregar';
    btnAdd.style.marginTop = '10px';
    btnAdd.onclick = async ()=>{
      const name = nameInput.value.trim();
      if(!name){ showToast('Escribe un nombre.'); return; }
      state.staff.push({id: uid(), name, area: areaSelect.value});
      await saveStaff();
      nameInput.value = '';
      render();
      showToast(name+' agregado.');
    };
    addCard.appendChild(nameInput);
    addCard.appendChild(areaSelect);
    addCard.appendChild(btnAdd);
    wrap.appendChild(addCard);

    const areaCard = document.createElement('div');
    areaCard.className = 'card';
    areaCard.innerHTML = '<h2 class="section-title">Agregar área</h2>';
    const areaInput = document.createElement('input');
    areaInput.type = 'text';
    areaInput.placeholder = 'Nombre del área';
    const btnAddArea = document.createElement('button');
    btnAddArea.className = 'action secundario';
    btnAddArea.textContent = 'Agregar área';
    btnAddArea.style.marginTop = '10px';
    btnAddArea.onclick = async ()=>{
      const a = areaInput.value.trim();
      if(!a) return;
      if(state.areas.includes(a)){ showToast('Esa área ya existe.'); return; }
      state.areas.push(a);
      await saveAreas();
      areaInput.value = '';
      render();
    };
    areaCard.appendChild(areaInput);
    areaCard.appendChild(btnAddArea);
    wrap.appendChild(areaCard);

    const listCard = document.createElement('div');
    listCard.className = 'card';
    listCard.innerHTML = '<h2 class="section-title">Personal registrado ('+state.staff.length+')</h2>';
    const byArea = {};
    state.staff.forEach(p=>{
      if(!byArea[p.area]) byArea[p.area] = [];
      byArea[p.area].push(p);
    });
    Object.keys(byArea).sort().forEach(area=>{
      const h = document.createElement('div');
      h.style.marginTop = '14px';
      h.innerHTML = '<div style="font-weight:700;font-size:13px;color:var(--barro-osc);margin-bottom:4px;">'+area+'</div>';
      byArea[area].forEach(p=>{
        const row = document.createElement('div');
        row.className = 'staff-row';
        row.innerHTML = '<div></div>';
        row.querySelector('div').textContent = p.name;
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'Eliminar';
        del.onclick = async ()=>{
          state.staff = state.staff.filter(x=>x.id!==p.id);
          await saveStaff();
          render();
        };
        row.appendChild(del);
        h.appendChild(row);
      });
      listCard.appendChild(h);
    });
    wrap.appendChild(listCard);

    return wrap;
  }

  function isValidTime(v){
    return /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  }

  async function editStaffRecord(date, ref){
    const nuevaEntrada = window.prompt('Hora de entrada (HH:MM), vacío para dejar igual:', ref.entrada||'');
    if(nuevaEntrada===null) return;
    if(nuevaEntrada.trim()){
      if(!isValidTime(nuevaEntrada.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      ref.entrada = nuevaEntrada.trim();
    }
    const nuevaSalida = window.prompt('Hora de salida (HH:MM), vacío para dejar igual, escribe "-" para borrarla:', ref.salida||'');
    if(nuevaSalida===null){ await saveRecords(date); render(); return; }
    if(nuevaSalida.trim()==='-'){ ref.salida = null; }
    else if(nuevaSalida.trim()){
      if(!isValidTime(nuevaSalida.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      ref.salida = nuevaSalida.trim();
    }
    await saveRecords(date);
    showToast('Registro actualizado.');
    render();
  }

  async function deleteStaffRecord(date, ref){
    if(!window.confirm('¿Eliminar este movimiento de '+ref.name+'? Esta acción no se puede deshacer.')) return;
    const arr = state.recordsByDate[date] || [];
    const idx = arr.indexOf(ref);
    if(idx>-1) arr.splice(idx,1);
    await saveRecords(date);
    showToast('Movimiento eliminado.');
    render();
  }

  async function deleteVisitorRecord(date, id){
    if(!window.confirm('¿Eliminar esta visita? Esta acción no se puede deshacer.')) return;
    state.visitorsByDate[date] = (state.visitorsByDate[date]||[]).filter(x=>x.id!==id);
    await saveVisitors(date);
    showToast('Visita eliminada.');

  function calcMinutos(entrada, salida){
    if(!entrada || !salida) return null;
    const [eh, em] = entrada.split(':').map(Number);
    const [sh, sm] = salida.split(':').map(Number);
    let mins = (sh*60+sm) - (eh*60+em);
    if(mins < 0) mins += 24*60;
    return mins;
  }

  function minsToLabel(mins){
    if(mins==null) return null;
    const h = Math.floor(mins/60);
    const m = mins % 60;
    return h + 'h ' + String(m).padStart(2,'0') + 'm';
  }

  function calcHoras(entrada, salida){
    return minsToLabel(calcMinutos(entrada, salida));
  }

  // Agrupa las sesiones (entrada/salida) de un área por persona.
  // Si alguien reingresó (turno extra), cada sesión queda como su propia fila
  // bajo el mismo nombre, y se agrega una fila de total al final.
  function buildPersonRows(records){
    const byPerson = {};
    const order = [];
    records.forEach(r=>{
      if(!byPerson[r.staffId]){ byPerson[r.staffId] = []; order.push(r.staffId); }
      byPerson[r.staffId].push(r);
    });
    const rows = [];
    order.forEach(staffId=>{
      const sessions = byPerson[staffId].slice().sort((a,b)=>(a.entrada||'').localeCompare(b.entrada||''));
      let totalMins = 0;
      sessions.forEach((s,idx)=>{
        const mins = calcMinutos(s.entrada, s.salida);
        if(mins!=null) totalMins += mins;
        rows.push({
          name: idx===0 ? sessions[0].name : sessions[0].name + ' (turno extra)',
          entrada: s.entrada || '—',
          entradaPor: s.entradaPor || '—',
          salida: s.salida || '—',
          salidaPor: s.salidaPor || '—',
          horas: minsToLabel(mins) || '—',
          extra: idx>0,
          ref: s
        });
      });
      if(sessions.length>1){
        rows.push({
          name: 'Total ' + sessions[0].name,
          entrada: '', entradaPor:'', salida: '', salidaPor:'', horas: minsToLabel(totalMins) || '—', isTotal: true
        });
      }
    });
    return rows;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderLockScreen(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    const outer = document.createElement('div');
    outer.id = 'lock-screen';
    const card = document.createElement('div');
    card.className = 'lock-card';
    card.innerHTML = '<h1>Portería · Control de Acceso</h1><p>Ingresa el PIN para continuar</p>';
    const input = document.createElement('input');
    input.type = 'password';
    input.inputMode = 'numeric';
    input.maxLength = 8;
    input.placeholder = '••••';
    const err = document.createElement('div');
    err.className = 'err';
    err.textContent = state.loginError || '';
    const btn = document.createElement('button');
    btn.className = 'action';
    btn.style.width = '100%';
    btn.textContent = 'Entrar';
    const tryLogin = async ()=>{
      const val = input.value.trim();
      if(!val) return;
      if(!state.pins.guardiaHash || !state.pins.adminHash){
        state.loginError = 'Conectando con la nube, espera un momento…';
        render();
        return;
      }
      let hash;
      try{
        hash = await sha256Hex(val);
      }catch(e){
        state.loginError = 'Este acceso solo funciona en el link https:// publicado.';
        render();
        return;
      }
      const guardia = state.guardias.find(g=>g.pinHash===hash);
      const administrativo = state.administrativos.find(a=>a.pinHash===hash);
      if(hash === state.pins.adminHash){
        state.session = {role:'admin'};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(guardia){
        state.session = {role:'guardia', guardId: guardia.id, guardName: guardia.nombre};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(administrativo){
        state.session = {role:'administrativo', nombre: administrativo.nombre};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(hash === state.pins.guardiaHash){
        state.session = {role:'guardia', guardId:null, guardName:'Guardia'};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else {
        state.loginError = 'PIN incorrecto.';
        render();
      }
    };
    btn.onclick = tryLogin;
    input.onkeydown = (e)=>{ if(e.key==='Enter') tryLogin(); };
    card.appendChild(input);
    card.appendChild(err);
    card.appendChild(btn);
    outer.appendChild(card);
    app.appendChild(outer);
    setTimeout(()=> input.focus(), 0);
  }

  function logout(){
    state.session = null;
    localStorage.removeItem('porteria_session');
    render();
  }

  const savedSession = localStorage.getItem('porteria_session');
  if(savedSession){
    try{
      const parsed = JSON.parse(savedSession);
      if(parsed && TABS_BY_ROLE[parsed.role]) state.session = parsed;
    }catch(e){}
  }

  bootstrapAndListen();
})();
